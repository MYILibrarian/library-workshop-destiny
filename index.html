<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Your Library Workshop?</title>
 
<style>
body {
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#003366,#005f99);
color: white;
text-align: center;
padding: 40px;
min-height: 100vh;
}
 
.container {
max-width: 700px;
margin: auto;
background: rgba(255,255,255,0.1);
padding: 30px;
border-radius: 15px;
backdrop-filter: blur(8px);
}
 
h1 {
margin-bottom: 10px;
}
 
input {
padding: 12px;
font-size: 16px;
border-radius: 8px;
border: none;
margin-top: 15px;
}
 
button {
padding: 12px 20px;
font-size: 16px;
border: none;
border-radius: 8px;
background: #ffcc00;
cursor: pointer;
font-weight: bold;
margin-left: 10px;
}
 
button:hover {
background: #ffd633;
}
 
.result {
margin-top: 30px;
text-align: left;
background: rgba(255,255,255,0.15);
padding: 20px;
border-radius: 12px;
}
 
.result h2 {
margin-top: 0;
}
</style>
</head>
<body>
 
<div class="container">
<h1>✨ What's Your Library Workshop? ✨</h1>
<p>Enter your birthday and discover your academic destiny.</p>
 
<input type="date" id="birthday">
<button onclick="findWorkshop()">Reveal My Workshop</button>
 
<div id="result"></div>
</div>
 
<script>
 
const workshops = [
 
{
title:"How to Communicate Science More Effectively",
type:"Science Communicator",
description:"You enjoy turning complex ideas into clear and engaging stories."
},
 
{
title:"Library Research Skills",
type:"Research Explorer",
description:"You love pursuing questions and uncovering reliable information."
},
 
{
title:"Mount Royal Walking Tour",
type:"Curious Observer",
description:"You notice details others miss and enjoy connecting ideas with the world around you."
},
 
{
title:"APA Citation Style",
type:"Precision Expert",
description:"Organization and attention to detail are your strengths."
},
 
{
title:"Introduction to Zotero",
type:"Research Organizer",
description:"You like keeping information structured and under control."
},
 
{
title:"EndNote Essentials",
type:"Reference Master",
description:"You appreciate efficient systems and smart workflows."
},
 
{
title:"Behind the Books",
type:"Library Insider",
description:"You are curious about how things work behind the scenes."
},
 
{
title:"Research After Graduation",
type:"Lifelong Learner",
description:"Learning doesn't stop when the degree ends."
},
 
{
title:"From Dissertation to Publication",
type:"Future Author",
description:"You have ideas worth sharing with the world."
},
 
{
title:"Statistics Canada Datasets and Excel",
type:"Data Explorer",
description:"You enjoy finding patterns hidden in numbers."
},
 
{
title:"Prepping for Your Lit Review",
type:"Knowledge Synthesizer",
description:"You bring ideas together and make sense of complexity."
},
 
{
title:"Finding Statistics for Your Paper",
type:"Evidence Seeker",
description:"You like supporting arguments with solid facts."
},
 
{
title:"Take the News Diet Challenge",
type:"Media Reflector",
description:"You think critically about information and its impact."
},
 
{
title:"What's Wrong With This Picture?",
type:"Data Detective",
description:"You enjoy spotting problems, inconsistencies, and misleading claims."
},
 
{
title:"Book Proposals, Contracts, and Beyond",
type:"Publishing Strategist",
description:"You think about the bigger picture and long-term goals."
},
 
{
title:"Spill the Tea: A Data-Driven Look at Gossip",
type:"Social Analyst",
description:"Human behaviour fascinates you."
},
 
{
title:"AI and Legal Research",
type:"AI Navigator",
description:"You are interested in emerging technologies and their implications."
},
 
{
title:"Avoiding AI",
type:"Digital Skeptic",
description:"You value understanding technology before embracing it."
},
 
{
title:"Finding and Verifying Primary Sources with GenAI",
type:"Truth Verifier",
description:"You believe evidence should always be checked."
},
 
{
title:"Getting Started with AI in Research",
type:"Experimental Scholar",
description:"You enjoy exploring new tools and methods."
},
 
{
title:"Introduction to AI-Assisted Scholarly Search",
type:"Research Futurist",
description:"You like looking ahead to the future of scholarship."
},
 
{
title:"AI in Health Sciences Literature Reviews",
type:"Critical Evaluator",
description:"You balance innovation with careful analysis."
},
 
{
title:"Fakes, Forgeries, and Facsimiles Before and After AI",
type:"Authenticity Investigator",
description:"You are fascinated by what is real and what only appears to be."
},
 
{
title:"Peer Reviewing and Responding to Peer Review",
type:"Collaborative Scholar",
description:"You believe constructive feedback makes research stronger."
},
 
{
title:"Critical, Constructive, Collegial",
type:"Thoughtful Reviewer",
description:"You value fairness, rigor, and professionalism."
},
 
{
title:"Map It! An Introduction to Digital Mapping Tools",
type:"Pattern Finder",
description:"You see connections where others see rows and columns."
},
 
{
title:"Broadening Readership Through Open Access Publishing",
type:"Knowledge Advocate",
description:"You believe knowledge should be widely shared."
},
 
{
title:"Publishing Research: Choosing Your Publisher",
type:"Academic Influencer",
description:"You want your work to reach the right audience."
}
 
];
 
function findWorkshop() {
 
const input = document.getElementById("birthday").value;
 
if(!input){
alert("Please select your birthday.");
return;
}
 
const birthDate = new Date(input);
 
const month = birthDate.getMonth() + 1;
const day = birthDate.getDate();
 
const index = (month + day) % workshops.length;
 
const workshop = workshops[index];
 
document.getElementById("result").innerHTML = `
<div class="result">
<h2>📚 Your Library Archetype:</h2>
<h3>${workshop.type}</h3>
 
<p>${workshop.description}</p>
 
<h2>✨ Your Workshop Match:</h2>
<h3>${workshop.title}</h3>
 
<p>
According to our entirely scientific and definitely not made-up
library destiny algorithm, this is the workshop meant for you.
</p>
</div>
`;
}
</script>
 
</body>
</html>
