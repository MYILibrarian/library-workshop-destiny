<title>What's Your Library Workshop?</title>
 
<style>
 
body {
font-family: Arial, sans-serif;
background: linear-gradient(
135deg,
#00152e 0%,
#002147 40%,
#003d73 100%

color: white;
margin: 0;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}
 
.container {
width: 100%;
max-width: 850px;
background: rgba(255,255,255,0.08);
backdrop-filter: blur(10px);
border-radius: 16px;
padding: 40px;
text-align: center;
box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}
 
h1 {
margin-top: 0;
}
 
input {
padding: 12px;
font-size: 16px;
border-radius: 8px;
border: none;
}
 
button {
padding: 12px 20px;
font-size: 16px;
border: none;
border-radius: 8px;
background: #FFCC00;
color: #002147;
font-weight: bold;
cursor: pointer;
margin-left: 10px;
}
 
button:hover {
background: #FFD84D;
}
 
.result {
margin-top: 30px;
background: white;
color: #333;
padding: 30px;
border-radius: 12px;
text-align: center;
}
 
.result h2,
.result h3 {
color: #002147;
}
 
.register-btn {
display: inline-block;
margin-top: 20px;
padding: 14px 24px;
background: #FFCC00;
color: #002147;
text-decoration: none;
border-radius: 8px;
font-weight: bold;
}
 
.register-btn:hover {
background: #FFD84D;
}
 
</style>
</head>
 
<body>
 
<div class="container">
 
<h1>📚 What's Your Library Workshop?</h1>
 
<p>
Enter your birthday and discover your library workshop destiny.
</p>
 
<input type="date" id="birthday">
<button onclick="findWorkshop()">

function findWorkshop() {
 
const input = document.getElementById("birthday").value;
 
if (!input) {
alert("Please enter your birthday.");
return;
}
 
const birthDate = new Date(input);
 
const month = birthDate.getMonth() + 1;
const day = birthDate.getDate();
 
const index = ((month * 31) + day) % workshops.length;
 
const workshop = workshops[index];
 
document.getElementById("result").innerHTML = `
<div class="result">
 
<h2>✨ Your Workshop Match ✨</h2>
 
<h3>${workshop.title}</h3>
 
<p>
<strong>📅 Date:</strong> ${workshop.date}
</p>
 
<p>
<strong>⏰ Time:</strong> ${workshop.time}
</p>
 
<a href="${workshop.url}" target="_blank" class="register-btn">
Register for this Workshop
</a>
 
</div>
`;
}
